name = "papo-reto"
main = "worker/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Rotas /api/* e o áudio (recorte em pedaços pro Safari) passam pelo Worker antes dos estáticos.
run_worker_first = ["/api/*", "/audio/*", "/audio-pt/*"]

# Cron: a cada minuto manda as notificações agendadas (ex.: "sua conversa com a IA liberou").
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "papo-reto"
database_id = "8f1283cd-87d5-4019-9302-a4507cd059bc"
migrations_dir = "migrations"

# Prévias dos Pull Requests (`wrangler preview` no Cloudflare Workers Builds).
# Usam o mesmo banco do app no ar, pra dar pra entrar com a conta de verdade e testar.
[[previews.d1_databases]]
binding = "DB"
database_name = "papo-reto"
database_id = "8f1283cd-87d5-4019-9302-a4507cd059bc"

# Salas ao vivo: um Durable Object por sala (código), com WebSocket hibernável.
# "new_sqlite_classes" = armazenamento SQLite do próprio objeto (o que roda no plano grátis).
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[previews.durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"
